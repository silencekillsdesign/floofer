name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      # Catches what tests can't: broken imports, bad assets (e.g. the PWA
      # precache size limit), nitro/module config drift.
      - run: npm run build

      # Smoke the actual production build — Playwright boots .output and
      # walks the first-minute visitor paths.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
